[package]
name = "zed-win-keys"
version = "0.1.0"
edition = "2021"
description = "Apply Windows-style keyboard shortcuts to Zed on macOS"
license = "MIT"
publish = false

[[bin]]
name = "zed-win-keys"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = "0.4"
